<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChipSet — Android Talk Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/slides.css">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden} .dr-stage{transform-origin:0 0}</style>
</head>
<body>
<!--
ChipSet (Labels) — Badges and status chips
Small labels that annotate a slide: status, model/version, result, inline terms and quick facts.

**Consumer provides:** the label text (1–3 words) and its kind.

- `dr-badge` (40px, 20px/600, pill): `is-green` for stable/success and timings; `is-lime` for beta and highlights; `is-blue` for experimental; `is-muted` for deprecated; default `green-tint` for model names; `is-dark` (code colours) for versions and artifacts.
- `dr-ichip`: a lime (or green) pill inside a sentence for prompt variables and key terms.
- `dr-opill`: outline pill for neutral facts and focus areas.
- A pinned top-right chip is `.dr-chip` (see `DemoSlide`). Max three badges in one group; status always carries its word, never colour alone.
-->
<div class="dr-stage"><div class="dr-slide">

<span class="dr-tag">Badges</span>
<div style="position:absolute;left:128px;top:240px;display:flex;flex-direction:column;gap:56px">
<div style="display:flex;gap:24px;align-items:center"><span style="width:260px;font-size:26px;color:var(--ink-muted)">Status</span><span class="dr-badge is-green">Stable</span><span class="dr-badge is-lime">Beta</span><span class="dr-badge is-blue">Experimental</span><span class="dr-badge is-muted">Deprecated</span></div>
<div style="display:flex;gap:24px;align-items:center"><span style="width:260px;font-size:26px;color:var(--ink-muted)">Model / version</span><span class="dr-badge">Gemma 3n 2B</span><span class="dr-badge">Gemini Nano</span><span class="dr-badge is-dark">v0.10.27</span></div>
<div style="display:flex;gap:24px;align-items:center"><span style="width:260px;font-size:26px;color:var(--ink-muted)">Result</span><span class="dr-badge is-green">Generated in 1.4 s</span><span class="dr-badge is-lime">~2,000 tokens</span></div>
<div style="display:flex;gap:24px;align-items:center"><span style="width:260px;font-size:26px;color:var(--ink-muted)">In running text</span><span style="font-size:36px">Turn the query into a <span class="dr-ichip is-green">JSON object</span> using <span class="dr-ichip">temperature 0.2</span></span></div>
<div style="display:flex;gap:24px;align-items:center"><span style="width:260px;font-size:26px;color:var(--ink-muted)">Facts</span><span class="dr-opill">2 functions</span><span class="dr-opill">5 files</span><span class="dr-opill">&lt; 1000 lines</span></div>
</div>

</div></div>
<script>
/* scale the 1920x1080 canvas to the window */
(function(){var s=document.querySelector('.dr-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
