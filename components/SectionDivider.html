<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SectionDivider — Android Talk Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/slides.css">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden} .dr-stage{transform-origin:0 0}</style>
</head>
<body>
<!--
SectionDivider (Slides) — Numbered chapter break
A chapter break: a giant blue-gradient numeral over the grid, the chapter title and one line of context.

**Consumer provides:** the chapter number, a 2–4 word title with one highlight, and a one-line subtitle.

- White ground + `dr-grid`; content aligned to the first grid column (x ≈ 250).
- Numeral: `dr-numeral` at 360px/700 (gradient `blue` → `blue-tint`), two digits.
- Small `lime` badge above ("Part Two", "Chapter 3").
- Title in `statement` (88/114) with one highlight; subtitle 32px `ink-muted`.
- Use it in long talks (30+ slides) instead of, or right before, a `StatementSlide`. Green variant: the numeral in white at 40% opacity on a `green` slide.
-->
<div class="dr-stage"><div class="dr-slide">

<div class="dr-grid"></div>
<div style="position:absolute;left:250px;top:250px"><span class="dr-badge is-lime" style="height:56px;font-size:24px;padding:0 28px">Part Two</span></div>
<div class="dr-numeral" style="position:absolute;left:236px;top:330px;font-size:360px;font-weight:700">02</div>
<div style="position:absolute;left:250px;top:720px;font-size:88px;line-height:114px">Under the <span class="hl-blue">Hood</span></div>
<div style="position:absolute;left:254px;top:850px;font-size:32px;color:var(--ink-muted)">How MediaPipe runs an LLM on your phone</div>

</div></div>
<script>
/* scale the 1920x1080 canvas to the window */
(function(){var s=document.querySelector('.dr-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
