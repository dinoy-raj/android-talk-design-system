<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeakerIntro — Android Talk Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/slides.css">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden} .dr-stage{transform-origin:0 0}</style>
</head>
<body>
<!--
SpeakerIntro (Slides) — About me
The "who's talking" slide: portrait on a soft panel, name, one-line pitch, focus-area pills and two proof stats.

**Consumer provides:** a portrait cut-out (transparent PNG), the one-line pitch with a blue and a green highlight, 2–4 focus areas, and 1–2 stats.

- Portrait on a `blue-panel` block (`radius-card`), with a small `lime` greeting pill overlapping its bottom-right corner.
- Name in `title` (96/116, 700); pitch at 40/52 with highlights.
- Focus areas as `dr-opill` outline pills (2px `card-border`, `ink-soft` 28px/500).
- Stats: value 64px/700 in `green` or `blue`, label 24px `ink-muted`. Two stats max; use real, current numbers.
- Place right after `TitleSlide`, or skip it when the host introduces you.
-->
<div class="dr-stage"><div class="dr-slide">

<span class="dr-tag">About Me</span>
<div style="position:absolute;left:180px;top:250px;width:560px;height:620px;border-radius:32px;background:var(--blue-panel);display:flex;align-items:flex-end;justify-content:center;padding-bottom:40px;color:var(--ink-soft);font-size:26px">portrait cut-out</div>
<div style="position:absolute;left:600px;top:760px;width:220px;height:72px;border-radius:999px;background:var(--lime);color:var(--on-lime);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600">Hi there ☺</div>
<div style="position:absolute;left:900px;top:290px;right:120px">
  <div style="font-size:96px;line-height:116px;font-weight:700">Your Name</div>
  <div style="font-size:40px;line-height:52px;margin-top:8px">Android Engineer building with <span class="hl-blue">Kotlin</span> &amp; <span class="hl-green">Compose</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:20px;margin-top:56px"><span class="dr-opill">Compose Multiplatform</span><span class="dr-opill">On-Device AI</span><span class="dr-opill">Design Systems</span></div>
  <div style="display:flex;gap:64px;margin-top:72px">
    <div><div style="font-size:64px;font-weight:700;color:var(--green);line-height:1">Top 5%</div><div style="font-size:24px;color:var(--ink-muted);margin-top:12px">your proof point</div></div>
    <div><div style="font-size:64px;font-weight:700;color:var(--blue);line-height:1">10+</div><div style="font-size:24px;color:var(--ink-muted);margin-top:12px">talks given</div></div>
  </div>
</div>

</div></div>
<script>
/* scale the 1920x1080 canvas to the window */
(function(){var s=document.querySelector('.dr-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
