<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline — Android Talk Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/slides.css">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden} .dr-stage{transform-origin:0 0}</style>
</head>
<body>
<!--
Timeline (Content) — Horizontal steps
A left-to-right sequence of 3–6 steps on a dashed line, for pipelines, setup flows and histories.

**Consumer provides:** step labels (or years), a 1–3 word heading and a one-line detail for each; which step is the destination.

- Dashed `card-border` line across the slide; each step = lime `dr-node` pill on top, a 2px stem, a 44px `green` cookie shape (`dr-shape is-cookie9`) on the line, heading 30px/500 and detail 24/32 `ink-muted` below.
- The destination step: solid `green` pill with white text and a larger 76px `green` sunny shape (`dr-shape is-sunny`).
- Equal columns; ≤ 6 steps. Longer flows go to `FlowDiagram`.
-->
<div class="dr-stage"><div class="dr-slide">

<span class="dr-tag">Model to App</span>
<div style="position:absolute;left:200px;right:200px;top:539px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--card-border) 0 16px,transparent 16px 28px)"></div>
<div style="position:absolute;left:160px;right:160px;top:300px;display:grid;grid-template-columns:repeat(5,1fr)">
<div style="display:flex;flex-direction:column;align-items:center;text-align:center"><span class="dr-node" style="font-size:24px;">Step 1</span><div style="width:2px;height:120px;border-radius:1px;background:var(--card-border)"></div><div class="dr-shape is-cookie9" style="width:44px;height:44px;margin:16px 0"></div><div style="font-size:30px;line-height:40px;font-weight:500;margin-top:48px">Pick a model</div><div style="font-size:24px;line-height:32px;color:var(--ink-muted);margin-top:12px;max-width:260px">Gemma 3 1B from Hugging Face</div></div><div style="display:flex;flex-direction:column;align-items:center;text-align:center"><span class="dr-node" style="font-size:24px;">Step 2</span><div style="width:2px;height:120px;border-radius:1px;background:var(--card-border)"></div><div class="dr-shape is-cookie9" style="width:44px;height:44px;margin:16px 0"></div><div style="font-size:30px;line-height:40px;font-weight:500;margin-top:48px">Quantize</div><div style="font-size:24px;line-height:32px;color:var(--ink-muted);margin-top:12px;max-width:260px">INT8 / INT4 weights</div></div><div style="display:flex;flex-direction:column;align-items:center;text-align:center"><span class="dr-node" style="font-size:24px;">Step 3</span><div style="width:2px;height:120px;border-radius:1px;background:var(--card-border)"></div><div class="dr-shape is-cookie9" style="width:44px;height:44px;margin:16px 0"></div><div style="font-size:30px;line-height:40px;font-weight:500;margin-top:48px">Convert</div><div style="font-size:24px;line-height:32px;color:var(--ink-muted);margin-top:12px;max-width:260px">Bundle into a .task file</div></div><div style="display:flex;flex-direction:column;align-items:center;text-align:center"><span class="dr-node" style="font-size:24px;">Step 4</span><div style="width:2px;height:120px;border-radius:1px;background:var(--card-border)"></div><div class="dr-shape is-cookie9" style="width:44px;height:44px;margin:16px 0"></div><div style="font-size:30px;line-height:40px;font-weight:500;margin-top:48px">Push</div><div style="font-size:24px;line-height:32px;color:var(--ink-muted);margin-top:12px;max-width:260px">adb push to the device</div></div><div style="display:flex;flex-direction:column;align-items:center;text-align:center"><span class="dr-node" style="font-size:24px;background:var(--green);color:var(--on-green);">Step 5</span><div style="width:2px;height:120px;border-radius:1px;background:var(--card-border)"></div><div class="dr-shape is-sunny" style="width:76px;height:76px;margin:0px 0"></div><div style="font-size:30px;line-height:40px;font-weight:500;margin-top:48px">Generate</div><div style="font-size:24px;line-height:32px;color:var(--ink-muted);margin-top:12px;max-width:260px">LlmInference on Android</div></div>
</div>

</div></div>
<script>
/* scale the 1920x1080 canvas to the window */
(function(){var s=document.querySelector('.dr-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
