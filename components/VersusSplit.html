<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VersusSplit — Android Talk Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/slides.css">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden} .dr-stage{transform-origin:0 0}</style>
</head>
<body>
<!--
VersusSplit (Content) — A vs B
Two opposing ideas side by side: white half vs green half, with a lime "vs" disc on the seam.

**Consumer provides:** two short names (1–2 words), a one-line description each, and 1–3 trait badges each.

- Left half `surface` with the name in `green` 120px/700; right half a `green` panel inset 24px from the edges with `radius-card` corners, name in `on-green`.
- Descriptions 28px (`ink-muted` / `on-green`); traits as `dr-badge` (green-tint on white, lime on green).
- 160px `lime` disc with "vs" in `on-lime`, centred on the seam.
- Put the "good"/default side on the left (white), the problem/twist on the right (green).
- Header variant for denser comparisons: two `green-tint` pills as column headers with bullets under each (ProtoBuf vs FlatBuffers).
-->
<div class="dr-stage"><div class="dr-slide">

<div style="position:absolute;left:0;top:0;width:960px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div style="font-size:120px;line-height:1;font-weight:700;color:var(--green)">Stable</div>
<div style="font-size:28px;color:var(--ink-muted);margin-top:28px">Primitives · String · data class with val</div>
<div style="display:flex;gap:16px;margin-top:48px"><span class="dr-badge">Skippable</span><span class="dr-badge">Restartable</span></div></div>
<div style="position:absolute;left:984px;top:24px;width:912px;height:1032px;border-radius:32px;background:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center">
<div style="font-size:120px;line-height:1;font-weight:700;color:var(--on-green)">UnStable</div>
<div style="font-size:28px;color:var(--on-green);margin-top:28px">Interfaces · List · var properties</div>
<div style="display:flex;gap:16px;margin-top:48px"><span class="dr-badge is-lime">Recomposes</span></div></div>
<div style="position:absolute;left:880px;top:460px;width:160px;height:160px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700">vs</div>

</div></div>
<script>
/* scale the 1920x1080 canvas to the window */
(function(){var s=document.querySelector('.dr-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
