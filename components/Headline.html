<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Headline — Android Talk Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/slides.css">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden} .dr-stage{transform-origin:0 0}</style>
</head>
<body>
<!--
Headline (Labels) — Slide headline
A large regular-weight headline top-left: the alternative slide header (droidcon Uganda deck) for long, content-dense talks.

**Consumer provides:** the headline text and one highlight phrase.

- `headline` style (72/88, 400) in `ink`, at `space-xl` left, 120px from the top.
- Highlight one phrase at the *same* weight (400) in `blue` (the concept) or `green` (the API/feature). For series slides use "Topic - **Facet**": the facet after the hyphen is the highlight ("Summarisation API - **Input restrictions**").
- Parenthetical qualifiers go in `ink-muted`.
- One line preferred; two lines max.
-->
<div class="dr-stage"><div class="dr-slide">

<h2 class="dr-headline"><span class="hl-blue" style="font-weight:400">Advantages</span> of being On-Device</h2>
<h2 class="dr-headline" style="top:300px">How android leverage On-Device AI<br>abstraction - <span class="hl-green" style="font-weight:400">AI Core</span></h2>
<h2 class="dr-headline" style="top:580px">Gemini Nano Experimental Access <span style="color:var(--ink-muted)">(Deprecated)</span></h2>

</div></div>
<script>
/* scale the 1920x1080 canvas to the window */
(function(){var s=document.querySelector('.dr-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
