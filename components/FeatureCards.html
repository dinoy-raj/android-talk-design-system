<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FeatureCards — Android Talk Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/slides.css">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden} .dr-stage{transform-origin:0 0}</style>
</head>
<body>
<!--
FeatureCards (Content) — Outlined card row
A row of 3–5 white outlined cards, each an icon, a title and a one-line description.

**Consumer provides:** per card a 3D/glossy icon (Google-style 3D illustrations in the past decks), a title (1–3 words) and a description (≤ 6 words, two lines).

- `dr-card`: `surface`, 2px `card-border`, `radius-card`; title `card-title` and body `card-body`, both `ink-muted`, centred.
- Equal widths, 44px gaps, icon in the top half.
- Status variant: cards labelled with a state (Downloadable / Downloading / Available / Unavailable).
- Don't colour the cards; colour comes from the icons.
-->
<div class="dr-stage"><div class="dr-slide">

<h2 class="dr-headline"><span class="hl-blue" style="font-weight:400">Advantages</span> of being On-Device</h2>
<div style="position:absolute;top:310px;left:140px;right:140px;display:grid;grid-template-columns:repeat(4,1fr);gap:44px">
<div class="dr-card" style="height:540px;justify-content:flex-end;padding-bottom:90px"><div style="width:160px;height:160px;border-radius:24px;background:var(--blue-tint);margin-bottom:auto;margin-top:40px"></div><h4>Latency / UX</h4><p>Faster, no network involved</p></div><div class="dr-card" style="height:540px;justify-content:flex-end;padding-bottom:90px"><div style="width:160px;height:160px;border-radius:24px;background:var(--blue-tint);margin-bottom:auto;margin-top:40px"></div><h4>Privacy</h4><p>Sensitive data not sent off device</p></div><div class="dr-card" style="height:540px;justify-content:flex-end;padding-bottom:90px"><div style="width:160px;height:160px;border-radius:24px;background:var(--blue-tint);margin-bottom:auto;margin-top:40px"></div><h4>Offline use</h4><p>Works without requiring cellular</p></div><div class="dr-card" style="height:540px;justify-content:flex-end;padding-bottom:90px"><div style="width:160px;height:160px;border-radius:24px;background:var(--blue-tint);margin-bottom:auto;margin-top:40px"></div><h4>Savings</h4><p>Lower or no data-center costs</p></div>
</div>

</div></div>
<script>
/* scale the 1920x1080 canvas to the window */
(function(){var s=document.querySelector('.dr-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
