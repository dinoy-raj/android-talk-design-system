<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StatHighlight — Android Talk Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/slides.css">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden} .dr-stage{transform-origin:0 0}</style>
</head>
<body>
<!--
StatHighlight (Content) — Big numbers
Two to four big numbers that carry the argument, each with a label and a source line.

**Consumer provides:** values (≤ 4 characters each), a 1–3 word label, and a one-line qualifier or source.

- Value at 200px/700 alternating `green` and `blue`; label at 40/52 `ink`; qualifier 26px `ink-muted`.
- Equal columns divided by 2px `hairline` rules; content starts ~300px from the top under a `TopicTag`.
- Use only measured or well-established numbers; put the source in the qualifier line.
- Don't add icons or cards around the numbers; whitespace does the framing.
-->
<div class="dr-stage"><div class="dr-slide">

<span class="dr-tag">FP32 → INT8 Quantization</span>
<div style="position:absolute;left:128px;right:128px;top:300px;display:grid;grid-template-columns:repeat(3,1fr)">
<div style="padding:0 64px;"><div style="font-size:180px;line-height:1;font-weight:700;color:var(--green);letter-spacing:-.02em">4×</div><div style="font-size:40px;line-height:52px;margin-top:36px">smaller weights</div><div style="font-size:26px;color:var(--ink-muted);margin-top:16px">32-bit floats → 8-bit integers</div></div><div style="padding:0 64px;border-left:2px solid var(--hairline);"><div style="font-size:180px;line-height:1;font-weight:700;color:var(--blue);letter-spacing:-.02em">75%</div><div style="font-size:40px;line-height:52px;margin-top:36px">less memory</div><div style="font-size:26px;color:var(--ink-muted);margin-top:16px">per parameter</div></div><div style="padding:0 64px;border-left:2px solid var(--hairline);"><div style="font-size:180px;line-height:1;font-weight:700;color:var(--green);letter-spacing:-.02em">0</div><div style="font-size:40px;line-height:52px;margin-top:36px">network calls</div><div style="font-size:26px;color:var(--ink-muted);margin-top:16px">inference stays on device</div></div>
</div>

</div></div>
<script>
/* scale the 1920x1080 canvas to the window */
(function(){var s=document.querySelector('.dr-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
