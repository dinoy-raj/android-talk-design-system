<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataTable — Android Talk Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/slides.css">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden} .dr-stage{transform-origin:0 0}</style>
</head>
<body>
<!--
DataTable (Content) — Comparison table
Comparison tables with a blue header row and alternating gray/blue rows.

**Consumer provides:** a header row and up to ~8 rows; keep cells short.

- `dr-table`: header `blue` with white 24px/500 text; body rows alternate `gray-row` and `blue-row`, text `ink-soft` 24/32; corners `radius-node`; no vertical rules.
- Small inline ✅ / 🟡 marks are fine in a "Result" column.
- For results tied to a device, put the device label as a small `blue`/`green` caption to the left of the table.
-->
<div class="dr-stage"><div class="dr-slide">

<h2 class="dr-headline">Different <span class="hl-blue" style="font-weight:400">NPUs</span> available in the market</h2>
<div style="position:absolute;top:290px;left:200px;right:200px"><table class="dr-table"><tr><th>Chip Maker</th><th>Chip Series (Mobile)</th><th>AI Accelerator Name</th></tr>
<tr><td>Google</td><td>Tensor</td><td>Tensor Processing Unit (TPU)</td></tr><tr><td>Qualcomm</td><td>Snapdragon</td><td>Neural Processing Unit (NPU)</td></tr><tr><td>Samsung</td><td>Exynos</td><td>Neural Processing Unit (NPU)</td></tr><tr><td>MediaTek</td><td>Dimensity</td><td>AI Processing Unit (APU)</td></tr><tr><td>Apple</td><td>A-series / M-series</td><td>Neural Engine</td></tr></table></div>

</div></div>
<script>
/* scale the 1920x1080 canvas to the window */
(function(){var s=document.querySelector('.dr-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
