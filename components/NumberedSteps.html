<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NumberedSteps — Android Talk Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/slides.css">
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden} .dr-stage{transform-origin:0 0}</style>
</head>
<body>
<!--
NumberedSteps (Content) — Discs and numerals
Numbered items as green discs with labels: a 2×2 grid, or a vertical list of four.

**Consumer provides:** 3–4 short labels (1–3 words), numbered 01–04.

- `dr-disc`: 170px `green` circle, two-digit number in white 32px/500; label in `step-label` (48/56) `ink`, 60px to the right.
- 2×2: columns read top-to-bottom (01, 02 left; 03, 04 right).
- Compact list (droidcon Uganda): 64px discs, labels at 28px, 52px rows.
- Ordered-pills variant: `dr-numeral` (gradient `blue` → `blue-tint`, 80px) next to a `dr-code-pill` (`green` fill, `lime` text) for code identifiers, staggered diagonally (01 left, 02 indented right).
-->
<div class="dr-stage"><div class="dr-slide">

<span class="dr-tag">Advanced API</span>
<div style="position:absolute;left:250px;top:310px;display:flex;align-items:center;gap:60px"><div class="dr-disc">01</div><div style="font-size:48px;line-height:56px">Usage Stats</div></div><div style="position:absolute;left:250px;top:676px;display:flex;align-items:center;gap:60px"><div class="dr-disc">02</div><div style="font-size:48px;line-height:56px">Accessibility</div></div><div style="position:absolute;left:1098px;top:310px;display:flex;align-items:center;gap:60px"><div class="dr-disc">03</div><div style="font-size:48px;line-height:56px">Device Admin</div></div><div style="position:absolute;left:1098px;top:676px;display:flex;align-items:center;gap:60px"><div class="dr-disc">04</div><div style="font-size:48px;line-height:56px">Draw over apps</div></div>

</div></div>
<script>
/* scale the 1920x1080 canvas to the window */
(function(){var s=document.querySelector('.dr-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
